[package]
name = "dayflow-desktop"
version = "0.1.0"
description = "DayFlow — local-first personal task and schedule app (desktop)"
authors = ["DayFlow"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dayflow_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "NSApplication", "NSRunningApplication", "NSWindow", "NSWorkspace"] }

[dev-dependencies]
tempfile = "3"
