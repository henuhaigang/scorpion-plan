name: Client releases

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
      - name: Configure Android release signing
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            keystore="$RUNNER_TEMP/splan-upload-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          elif [[ ! -f "apps/mobile/android/keystore/splan-release.jks" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APK and App Bundle
        working-directory: apps/mobile
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/release-assets/Splan-Android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/release-assets/Splan-Android.aab"
          if [[ "${{ steps.android-signing.outputs.signed }}" == "true" ]]; then
            printf '%s\n' "Signed using available Android keystore." \
              > "$RUNNER_TEMP/release-assets/Android-SIGNING-STATUS.txt"
          else
            printf '%s\n' "Unsigned: configure Android signing secrets to produce distributable packages." \
              > "$RUNNER_TEMP/release-assets/Android-SIGNING-STATUS.txt"
          fi
      - name: Verify APK
        working-directory: apps/mobile
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: APK not found at $APK_PATH" >&2
            exit 1
          fi
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
          echo "Verifying APK signature..."
          if command -v apksigner &> /dev/null; then
            apksigner verify --print-certs "$APK_PATH"
          else
            echo "apksigner not found, skipping signature verification"
          fi
          echo "Checking APK contents..."
          unzip -l "$APK_PATH" | grep -E "AndroidManifest.xml|classes.dex|META-INF" | head -20
          if ! unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"; then
            echo "ERROR: AndroidManifest.xml not found in APK" >&2
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -q "classes.dex"; then
            echo "ERROR: classes.dex not found in APK" >&2
            exit 1
          fi
          echo "APK verification passed"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
      - name: Build unsigned iOS simulator app
        working-directory: apps/mobile
        run: |
          flutter build ios --simulator --debug --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/release-assets"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "$RUNNER_TEMP/release-assets/Splan-iOS-Simulator.zip"
          printf '%s\n' \
            "Simulator build only; not installable on physical iPhones." \
            "This workflow does not produce a signed device IPA." \
            > "$RUNNER_TEMP/release-assets/iOS-SIGNING-STATUS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios-simulator
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  desktop-macos:
    name: macOS desktop release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop
        run: pnpm test
      - name: Build macOS app and DMG
        run: pnpm --filter splan-desktop build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  desktop-windows:
    name: Windows desktop release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop
        run: pnpm test
      - name: Build Windows installers
        run: pnpm --filter splan-desktop exec tauri build --bundles msi,nsis
      - name: Stage Windows installers
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" $assets
          Copy-Item "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" $assets
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish main build
    runs-on: ubuntu-latest
    needs: [android, ios, desktop-macos, desktop-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.run_number }}-${{ github.sha }}
          name: Splan main build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
